<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AskyShooter">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AskyShooter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header, stage chips, shooter rows, ranking view */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --fg:#22231f; --muted:#6c6a61; --line:#dcd7cb;
  --accent:#b8873f; --accent-ink:#ffffff; --accent-soft:#f1e5d0; --good:#2f7a4b; --bad:#b33b2e;
  --f-display:"Saira Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161714; --surface:#20211d; --fg:#ecebe5; --muted:#a3a094; --line:#35362f;
  --accent:#d6a55c; --accent-ink:#1a1a17; --accent-soft:#3a3122; --good:#6cc28c; --bad:#ec7a6c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161714; --surface:#20211d; --fg:#ecebe5; --muted:#a3a094; --line:#35362f;
  --accent:#d6a55c; --accent-ink:#1a1a17; --accent-soft:#3a3122; --good:#6cc28c; --bad:#ec7a6c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;align-items:center;gap:10px}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;flex:1;text-transform:uppercase}
h1 span{color:var(--accent)}
.logo{width:60px;height:60px;object-fit:contain;flex:none}
.tabs{display:flex;gap:6px}
.tab{flex:1;font:600 14px var(--f-body);padding:9px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button{font-family:var(--f-body)}
.btn{font:600 14px var(--f-body);padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.label{font:600 11px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meta{display:flex;gap:8px}
.meta{flex-wrap:wrap}
.meta input{flex:1 1 160px;min-width:0}
.meta input.date{flex:0 0 auto;width:auto;min-width:11.5em;padding-right:8px}
input{font:500 16px var(--f-body);padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%;min-width:0}
input.num{font-family:var(--f-num);text-align:right}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;font:700 15px var(--f-display);letter-spacing:.04em;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.rowhead{display:flex;align-items:baseline;gap:8px}
.rowhead b{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.hf{font:700 22px var(--f-num);font-variant-numeric:tabular-nums}
.hf small{font:500 11px var(--f-body);color:var(--muted);letter-spacing:.1em;margin-right:4px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.stagebox{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.stagebox label{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.stagebox input{flex:0 0 90px;width:90px}
.fixed{display:block;font:500 16px var(--f-num);text-align:right;padding:9px 10px;border-radius:8px;border:1px dashed var(--line);color:var(--fg);background:var(--bg)}
.hf .warn{font:600 13px var(--f-body);color:var(--bad)}
.neg{position:relative;display:block}
.neg>span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font:700 17px var(--f-num);color:var(--bad);pointer-events:none}
.neg input{padding-left:24px;text-align:left;color:var(--bad)}
.toggles{display:flex;gap:6px}
.tog{font:600 13px var(--f-body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.tog[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tog.dq[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row.off input{opacity:.45}
tr.dqrow td{color:var(--bad)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.hint{font-size:13px;color:var(--muted);margin:0}
.badge{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--accent-soft);color:var(--fg);padding:3px 8px;border-radius:999px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
td{font-family:var(--f-num);font-size:14px}
td.n,th.n{text-align:left;font-family:var(--f-body);white-space:normal}
td.pos{text-align:left;color:var(--muted);width:2em}
tr:last-child td{border-bottom:none}
tr.first td{font-weight:700}
tr.first td.pos{color:var(--accent)}
h2{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;text-transform:uppercase;margin:0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.confirm p{margin:0;flex:1 1 100%}
.sign{margin-top:12px;margin-bottom:-14px;display:flex;align-items:center;justify-content:flex-end;gap:4px}
.stamp{width:min(34vw,150px);height:auto;margin:-6px -4px -6px 0;transform:rotate(-15deg);flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.signtxt{display:flex;flex-direction:column;text-align:right;font:700 22px var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);line-height:1.1}
.signtxt span{font-size:14px;letter-spacing:.16em;color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20}
textarea{width:100%;font:13px var(--f-num);padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:160px}
</style>

</head>

<main class="wrap" style="padding-bottom:6px">
  <div id="confirmBox" hidden></div>
  <div id="viewStage"></div>
  <div id="viewRank" hidden></div>
  <footer class="sign"><div class="signtxt">AskyShooter<span>by Pettynko</span></div><img class="stamp" alt="Logo Askere Patkaňaris"></footer>
</main>
<div class="toast" id="toast" hidden></div>

<script>
const KEY='ipsc-pocitadlo-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
function sample(){
  const a=uid(),b=uid(),c=uid();
  return {name:'Ukážkový tréning',date:today(),sample:true,cur:0,
    shooters:[{id:a,name:'Peter'},{id:b,name:'Marek'},{id:c,name:'Juraj'}],
    stages:[
      {id:uid(),max:'125',res:{[a]:{t:'18.42',l:'23'},[b]:{t:'21.05',l:'7'},[c]:{t:'16.80',l:'30'}}},
      {id:uid(),max:'80',res:{[a]:{t:'12.10',l:'2'},[b]:{t:'11.35',l:'10'},[c]:{t:'14.90',l:'0'}}}
    ]};
}
function blank(){return {name:'Tréning',date:today(),cur:0,shooters:[],stages:[{id:uid(),max:'',res:{}}]}}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.stages)S=sample();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const num=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isFinite(x)?x:NaN};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hf(r,max){if(!r||r.dq||!(max>0))return NaN;if(r.z)return 0;const t=num(r.t),l=Math.abs(num(r.l)||0);if(!(t>0))return NaN;return Math.max(0,max-l)/t}
function hfHtml(r,max){if(r&&r.dq)return '<span class="warn">DQ</span>';return max>0?fmt(hf(r,max)):'<span class="warn">Zadaj max. body</span>'}
const isDQ=sid=>S.stages.some(st=>st.res[sid]&&st.res[sid].dq);
function refreshRows(){
  const st=S.stages[S.cur],mx=num(st.max);
  S.shooters.forEach(sh=>{
    const h=document.querySelector(`[data-hf="${sh.id}"]`);if(h)h.innerHTML=hfHtml(st.res[sh.id],mx);
    const b=document.querySelector(`[data-body="${sh.id}"]`);if(b)b.textContent=mx>0?mx:'—';
  });
}
const fmt=x=>isNaN(x)?'—':x.toFixed(4);
const f2=x=>isNaN(x)?'—':x.toFixed(2);

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,1800)}

function renderStage(){
  const st=S.stages[S.cur];
  let h=`<section><div class="label">Názov udalosti ${S.sample?'<span class="badge">ukážka</span>':''}</div>
   <div class="meta"><input id="tName" value="${esc(S.name)}" placeholder="Tréning" aria-label="Názov udalosti"><input id="tDate" type="date" value="${esc(S.date)}" aria-label="Dátum" class="date"></div></section>
   <section><div class="label">Stage</div><div class="chips">`;
  S.stages.forEach((s,i)=>h+=`<button class="chip" data-stage="${i}" aria-pressed="${i===S.cur}">Stage ${i+1}</button>`);
  h+=`<button class="chip add" id="addStage">+ Stage</button></div>
   <div class="stagebox"><label for="stMax"><b>Max. body Stage ${S.cur+1}</b><span class="hint">Všetky zásahy v A, napr. 25 rán × 5 = 125</span></label>
     <input class="num" id="stMax" inputmode="decimal" placeholder="125" value="${esc(st.max)}"></div></section>
   <section><div class="label">Strelci · Stage ${S.cur+1}</div>`;
  if(!S.shooters.length)h+=`<p class="hint">Pridaj prvého strelca nižšie.</p>`;
  S.shooters.forEach(sh=>{
    const r=st.res[sh.id]||{},mx=num(st.max),off=r.z||r.dq?' disabled':'';
    h+=`<div class="row${r.z||r.dq?' off':''}" data-sid="${sh.id}"><div class="rowhead"><b>${esc(sh.name)}</b><span class="hf"><small>HF</small><span data-hf="${sh.id}">${hfHtml(r,mx)}</span></span></div>
     <div class="fields">
      <label><span>Max. body</span><span class="fixed" data-body="${sh.id}">${mx>0?mx:'—'}</span></label>
      <label>Čas (s)<input class="num" inputmode="decimal" data-f="t" id="t-${st.id}-${sh.id}" value="${esc(r.t??'')}"${off}></label>
      <label>Stratené body<span class="neg"><span aria-hidden="true">−</span><input class="num" inputmode="decimal" data-f="l" id="l-${st.id}-${sh.id}" value="${esc(r.l??'')}" placeholder="0"${off}></span></label>
     </div>
     <div class="toggles"><button class="tog" data-tog="z" aria-pressed="${!!r.z}">Stage za 0</button><button class="tog dq" data-tog="dq" aria-pressed="${!!r.dq}">DQ</button></div></div>`;
  });
  h+=`<div class="addrow"><input id="newName" placeholder="Meno strelca" aria-label="Meno strelca"><button class="btn pri" id="addShooter">Pridať</button></div>
   <p class="hint">HF = (max. body − stratené body) ÷ čas. Do stratených bodov patria body stratené za zásahy v C a D, missy aj penalizácie. Desatinné čísla môžeš písať s čiarkou aj bodkou.</p>
   <p class="hint"><b>Stage za 0</b>: strelec dostane v tejto stage 0 bodov (napr. nedodržal postup stage). <b>DQ</b>: diskvalifikácia, strelec vypadne z celej udalosti a nie je v poradí.</p>`;
  if(S.stages.length>1)h+=`<button class="btn danger" id="delStage" style="align-self:flex-start">Zmazať Stage ${S.cur+1}</button>`;
  h+=`</section>`;
  document.getElementById('viewStage').innerHTML=h;
}

function compute(){
  const tot={};S.shooters.forEach(s=>tot[s.id]=0);
  const stages=S.stages.map((st,i)=>{
    const max=num(st.max)>0?num(st.max):0;
    const rows=S.shooters.filter(s=>!isDQ(s.id)).map(s=>({s,hf:hf(st.res[s.id],num(st.max)),r:st.res[s.id]||{}})).filter(x=>!isNaN(x.hf));
    const dq=S.shooters.filter(s=>st.res[s.id]&&st.res[s.id].dq);
    const best=Math.max(0,...rows.map(x=>x.hf));
    rows.forEach(x=>{x.pts=best>0?x.hf/best*max:0;tot[x.s.id]+=x.pts});
    rows.sort((a,b)=>b.hf-a.hf);
    return {i,max,rows,dq};
  });
  const overall=S.shooters.filter(s=>!isDQ(s.id)).map(s=>({s,pts:tot[s.id]})).sort((a,b)=>b.pts-a.pts);
  const lead=overall[0]?.pts||0;overall.forEach(o=>o.pct=lead>0?o.pts/lead*100:0);
  const dqs=S.shooters.filter(s=>isDQ(s.id));
  return {stages,overall,dqs};
}

function renderRank(){
  const {stages,overall,dqs}=compute();
  let h=`<section><h2>Celkové poradie</h2><div class="tbl"><table><tr><th></th><th class="n">Strelec</th><th>Body</th><th>%</th></tr>`;
  overall.forEach((o,k)=>h+=`<tr class="${k===0&&o.pts>0?'first':''}"><td class="pos">${k+1}.</td><td class="n">${esc(o.s.name)}</td><td>${f2(o.pts)}</td><td>${o.pct.toFixed(1)}</td></tr>`);
  dqs.forEach(s=>h+=`<tr class="dqrow"><td class="pos">–</td><td class="n">${esc(s.name)}</td><td colspan="2">DQ</td></tr>`);
  if(!overall.length&&!dqs.length)h+=`<tr><td class="n" colspan="4">Zatiaľ žiadni strelci.</td></tr>`;
  h+=`</table></div><p class="hint">Víťaz stage dostane jej max. body, ostatní pomerne podľa HF. Body zo všetkých stage sa sčítajú.</p></section>`;
  stages.forEach(st=>{
    h+=`<section><h2>Stage ${st.i+1}</h2><div class="tbl"><table><tr><th></th><th class="n">Strelec</th><th>HF</th><th>Čas</th><th>Body</th></tr>`;
    st.rows.forEach((x,k)=>h+=`<tr class="${k===0?'first':''}"><td class="pos">${k+1}.</td><td class="n">${esc(x.s.name)}</td><td>${fmt(x.hf)}</td><td>${f2(num(x.r.t))}</td><td>${x.r.z?'0 (stage za 0)':f2(x.pts)}</td></tr>`);
    st.dq.forEach(s=>h+=`<tr class="dqrow"><td class="pos">–</td><td class="n">${esc(s.name)}</td><td colspan="3">DQ</td></tr>`);
    if(!st.rows.length&&!st.dq.length)h+=`<tr><td class="n" colspan="5">Bez výsledkov.</td></tr>`;
    h+=`</table></div></section>`;
  });
  h+=`<section><button class="btn pri" id="copyBtn">Kopírovať výsledky</button><p class="hint">Skopíruje výsledky ako text, ktorý vložíš do WhatsAppu alebo Messengera.</p><textarea id="shareTxt" readonly hidden></textarea></section>`;
  document.getElementById('viewRank').innerHTML=h;
}

function resultsText(){
  const {stages,overall,dqs}=compute();
  let t=`${S.name} – ${S.date.split('-').reverse().join('.')}\n\nCELKOVO\n`;
  overall.forEach((o,k)=>t+=`${k+1}. ${o.s.name} – ${f2(o.pts)} b (${o.pct.toFixed(1)} %)\n`);
  dqs.forEach(s=>t+=`DQ – ${s.name}\n`);
  stages.forEach(st=>{t+=`\nSTAGE ${st.i+1}\n`;st.rows.forEach((x,k)=>t+=x.r.z?`${k+1}. ${x.s.name} – stage za 0\n`:`${k+1}. ${x.s.name} – HF ${fmt(x.hf)} (${f2(num(x.r.t))} s)\n`);st.dq.forEach(s=>t+=`DQ – ${s.name}\n`)});
  return t;
}

function show(view){
  const rank=view==='rank';
  document.getElementById('tabStage').setAttribute('aria-selected',!rank);
  document.getElementById('tabRank').setAttribute('aria-selected',rank);
  document.getElementById('viewStage').hidden=rank;
  document.getElementById('viewRank').hidden=!rank;
  rank?renderRank():renderStage();
}

document.getElementById('tabStage').onclick=()=>show('stage');
document.getElementById('tabRank').onclick=()=>show('rank');

document.getElementById('newBtn').onclick=()=>{
  const b=document.getElementById('confirmBox');
  b.innerHTML=`<section><div class="confirm"><p>Začať novú udalosť? Aktuálne výsledky sa vymažú. Strelcov môžeš ponechať.</p>
   <button class="btn pri" id="cKeep">Nový, rovnakí strelci</button><button class="btn danger" id="cAll">Vymazať všetko</button><button class="btn ghost" id="cNo">Zrušiť</button></div></section>`;
  b.hidden=false;
};
document.getElementById('confirmBox').onclick=e=>{
  const id=e.target.id;if(!id)return;
  if(id==='cKeep'||id==='cAll'){
    const keep=id==='cKeep'&&!S.sample?S.shooters:[];
    S=blank();S.shooters=keep;save();toast('Nová udalosť');show('stage');
  }
  if(['cKeep','cAll','cNo'].includes(id))document.getElementById('confirmBox').hidden=true;
};

const VS=document.getElementById('viewStage');
VS.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.stage!==undefined){S.cur=+t.dataset.stage;save();renderStage()}
  else if(t.id==='addStage'){S.stages.push({id:uid(),max:'',res:{}});S.cur=S.stages.length-1;save();renderStage()}
  else if(t.id==='delStage'){S.stages.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);save();renderStage();toast('Stage zmazaná')}
  else if(t.id==='addShooter')addShooter();
  else if(t.dataset.tog){
    const sid=t.closest('.row').dataset.sid,st=S.stages[S.cur],k=t.dataset.tog;
    const r=st.res[sid]=st.res[sid]||{};r[k]=!r[k];if(r[k])r[k==='z'?'dq':'z']=false;
    S.sample=false;save();renderStage();
  }
});
function addShooter(){
  const i=document.getElementById('newName');const n=i.value.trim();if(!n){i.focus();return}
  if(S.sample){S=blank();}
  S.shooters.push({id:uid(),name:n});save();renderStage();
  const ni=document.getElementById('newName');ni&&ni.focus();
}
VS.addEventListener('keydown',e=>{if(e.target.id==='newName'&&e.key==='Enter')addShooter()});
VS.addEventListener('input',e=>{
  const t=e.target,st=S.stages[S.cur];
  if(t.id==='tName'){S.name=t.value;S.sample=false}
  else if(t.id==='tDate'){S.date=t.value}
  else if(t.id==='stMax'){st.max=t.value;refreshRows()}
  else if(t.dataset.f){
    const sid=t.closest('.row').dataset.sid;
    st.res[sid]=st.res[sid]||{};st.res[sid][t.dataset.f]=t.value;S.sample=false;
    refreshRows();
  }
  save();
});

document.getElementById('viewRank').addEventListener('click',e=>{
  if(e.target.id!=='copyBtn')return;
  const txt=resultsText();
  const fallback=()=>{const ta=document.getElementById('shareTxt');ta.value=txt;ta.hidden=false;ta.focus();ta.select();toast('Označ text a skopíruj ho')};
  try{navigator.clipboard.writeText(txt).then(()=>toast('Skopírované'),fallback)}catch(err){fallback()}
});

document.querySelector('.stamp').src=document.querySelector('.logo').src;
show('stage');
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
